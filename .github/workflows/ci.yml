name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      generate_locks:
        description: Generate dependency locks only; does not validate the application
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'edited' }}
permissions:
  contents: read
jobs:
  generate-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_locks == true
    uses: ./.github/workflows/dependency-locks.yml
  plan:
    if: github.event_name != 'workflow_dispatch' || inputs.generate_locks != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.changes.outputs.full }}
      finbook: ${{ steps.changes.outputs.finbook }}
      mcp: ${{ steps.changes.outputs.mcp }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Detect affected areas and validate release policy
        id: changes
        run: |
          node scripts/check-locks.mjs
          node scripts/workflow-policy.mjs
      - name: Patch hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Reuse identical successful metadata validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_SCOPE: ${{ toJSON(steps.changes.outputs) }}
        run: node scripts/actions-evidence.mjs reuse metadata
      - name: Dependency-free distribution, documentation and policy regressions
        if: steps.reuse.outputs.reused != 'true'
        run: npm run test:distribution
  studio:
    needs: plan
    if: (github.event_name != 'workflow_dispatch' || inputs.generate_locks != true) && needs.plan.outputs.full == 'true' && needs.plan.outputs.reused != 'true'
    uses: ./.github/workflows/validation-lane.yml
    with:
      lane: studio
  finbook:
    needs: plan
    if: (github.event_name != 'workflow_dispatch' || inputs.generate_locks != true) && needs.plan.outputs.finbook == 'true' && needs.plan.outputs.reused != 'true'
    uses: ./.github/workflows/validation-lane.yml
    with:
      lane: finbook
  mcp:
    needs: plan
    if: (github.event_name != 'workflow_dispatch' || inputs.generate_locks != true) && needs.plan.outputs.mcp == 'true' && needs.plan.outputs.reused != 'true'
    uses: ./.github/workflows/validation-lane.yml
    with:
      lane: mcp
  validate:
    name: validate
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.generate_locks != true)
    needs: [plan, studio, finbook, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Require every selected lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/validate-lanes.mjs
      - name: Record complete evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/actions-evidence.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: .artifacts/validation
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
