name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use compatible npm resolver
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Finbook dependencies
        run: npm install --prefix apps/finbook --no-audit --no-fund

      - name: Install MCP server dependencies
        run: npm install --prefix packages/mcp-server --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Demonstrate published Sense services
        run: node --import tsx src/headless/senses-clock-demo.ts

      - name: Test standalone Finbook
        run: npm test --prefix apps/finbook

      - name: Test MCP server
        run: npm test --prefix packages/mcp-server

      - name: Smoke-test built browser host
        run: npm run test:pages
        env:
          CHROME_PATH: /usr/bin/google-chrome
