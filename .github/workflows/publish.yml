name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_ref:
        description: Published release tag or commit to redeploy or roll back Pages to
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'components-v')
    name: Validate Components release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release
        id: release
        shell: bash
        env:
          IS_DRAFT: ${{ github.event.release.draft }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$IS_DRAFT" = "false"
          version="$(node -p "require('./packages/components/package.json').version")"
          test "$TAG" = "components-v$version"
          if [ "$IS_PRERELEASE" = "true" ]; then
            [[ "$version" == *-* ]]
            echo "channel=next" >> "$GITHUB_OUTPUT"
          else
            [[ "$version" != *-* ]]
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use compatible npm resolver
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate vendored packages
        run: npm run validate:vendor

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect Components package
        run: npm pack --workspace gik-components --dry-run

      - name: Verify published GIK dependencies
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' |
          const pkg = require("./packages/components/package.json");
          for (const [name, version] of Object.entries(pkg.dependencies ?? {})) {
            if (name.startsWith("gik-")) console.log(`${name}@${version}`);
          }
          NODE
          while IFS= read -r dependency; do
            npm view "$dependency" version >/dev/null
          done

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'components-v')
    name: Publish Components
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify release ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.commit }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" main
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use compatible npm resolver
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Components with trusted publishing
        run: npm publish --workspace gik-components --tag "${{ needs.validate.outputs.channel }}" --access public --provenance

      - name: Record release summary
        if: always()
        env:
          RELEASE: ${{ github.event.release.html_url }}
          TAG: ${{ github.event.release.tag_name }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          {
            echo "## npm publication"
            echo
            echo "- Release: [$TAG]($RELEASE)"
            echo "- Package: \`gik-components\`"
            echo "- Channel: \`$CHANNEL\`"
            echo "- Authentication: npm trusted publishing"
          } >> "$GITHUB_STEP_SUMMARY"

  build-pages:
    name: Build and smoke-test Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Use compatible npm resolver
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build
        env:
          VITE_BASE: /gik-samples/

      - name: Smoke-test release artifact
        run: npm run test:pages
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_BASE: /gik-samples/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/browser-host/dist

  deploy-pages:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
