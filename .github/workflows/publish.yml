name: Deploy Samples Pages
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "storybook/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable historical components-v tag or full commit SHA for Pages rollback (never main)
        required: false
        type: string
  repository_dispatch:
    types: [gik-release-verified, gik-library-release-verified]
permissions:
  contents: read
concurrency:
  group: pages-refresh
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      providers_version: ${{ steps.plan.outputs.providers_version }}
      core_versions: ${{ steps.plan.outputs.core_versions }}
      refresh: ${{ steps.mode.outputs.refresh }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify official publication before rebuilding
        if: github.event_name == 'repository_dispatch'
        run: node scripts/verify-pages-publication.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - id: mode
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ -n "$RELEASE_REF" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          node scripts/check-locks.mjs
          node scripts/plan-release.mjs
  site:
    name: Build npm-backed site
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    env:
      VITE_BASE: /gik-samples/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-npm11.19-site-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-node24-npm11.19-site-
      - id: build
        env:
          REFRESH_LATEST: ${{ needs.plan.outputs.refresh }}
        run: |
          if [ "$REFRESH_LATEST" = true ]; then
            node scripts/resolve-latest-gik.mjs
          fi
          npm exec --yes --package=npm@11.19.0 -- npm install --no-audit --no-fund
          if [ "$REFRESH_LATEST" != true ]; then
            git diff --exit-code -- package-lock.json
          fi
          node scripts/check-locks.mjs
          npm run test:distribution
          npm run typecheck:studio
          npm test -- --exclude 'apps/finbook/**'
          npm run build -- --site-only
          node --input-type=module -e 'import {siteDigest} from "./scripts/actions-evidence.mjs"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, "sha256=" + siteDigest("src/browser-host/dist") + "\n");'
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: src/browser-host/dist
          if-no-files-found: error
          include-hidden-files: true
      - name: Retain exact build resolution for audit and rollback
        uses: actions/upload-artifact@v4
        with:
          name: pages-resolution
          path: |
            package-lock.json
            .artifacts/latest-gik.json
          if-no-files-found: error
  collect-pages:
    name: Verify site and refresh latest npm archives
    needs: [plan, site]
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /gik-samples/
      EXPECTED_SITE_SHA256: ${{ needs.site.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: src/browser-host/dist
      - name: Verify source-job digest before modifying or deploying the site
        run: node --input-type=module -e 'import {verifySite} from "./scripts/actions-evidence.mjs"; verifySite("src/browser-host/dist", process.env.EXPECTED_SITE_SHA256);'
      - name: Mirror latest published packages with verified integrity
        run: node scripts/collect-pages-packages.mjs
      - name: Smoke-test assembled artifact
        run: node scripts/smoke-pages.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHECK_PACKAGE_DOWNLOADS: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/browser-host/dist
  deploy-pages:
    name: Deploy Pages
    needs: collect-pages
    if: always() && needs.collect-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
