name: Release service providers
on:
  push:
    branches: [main]
    paths: [packages/service-providers/package.json]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable providers-v tag to publish"
        required: true
        type: string
      bootstrap:
        description: "One-time token publication to create the npm package"
        type: boolean
        default: false
      confirm:
        description: "Bootstrap requires PUBLISH gik-service-providers"
        type: string
permissions:
  contents: read
concurrency:
  group: service-providers-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.GIK_MAINTAINER_APP_ID }}
          private-key: ${{ secrets.GIK_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - run: node scripts/create-service-providers-release.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'providers-v') && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      commit: ${{ steps.candidate.outputs.commit }}
    env:
      PROVIDERS_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require immutable stable tag at current main
        run: node scripts/service-providers-distribution.mjs checkout
      - run: |
          npm exec --yes --package=npm@11.19.0 -- npm install --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm run build --workspace gik-service-providers
          npm run typecheck --workspace gik-service-providers
          npm test -- --run packages/service-providers/test/providers.test.ts
          node scripts/service-providers-distribution.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: service-providers-candidate
          path: .artifacts/service-providers
          if-no-files-found: error
          include-hidden-files: true
      - id: candidate
        run: node scripts/service-providers-distribution.mjs outputs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      PROVIDERS_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PROVIDERS_SHA: ${{ needs.validate.outputs.sha }}
      PROVIDERS_COMMIT: ${{ needs.validate.outputs.commit }}
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install publishing CLI without package credentials
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: service-providers-candidate
          path: .artifacts/service-providers
      - name: Reverify source/tag/main and exact candidate bytes
        run: node scripts/service-providers-distribution.mjs verify
      - name: One-time first publication with a protected token
        if: inputs.bootstrap == true
        run: node scripts/service-providers-distribution.mjs bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Recurring trusted publication
        if: inputs.bootstrap != true
        run: node scripts/service-providers-distribution.mjs publish
  verify:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVIDERS_SHA: ${{ needs.validate.outputs.sha }}
      PROVIDERS_COMMIT: ${{ needs.validate.outputs.commit }}
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: service-providers-candidate
          path: .artifacts/service-providers
      - run: node scripts/service-providers-distribution.mjs registry
