name: Prepare Components version in PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: components-version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Fetch PR as data, without checking it out
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch origin "$HEAD_SHA"
      - name: Create narrowly scoped versioning App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GIK_MAINTAINER_APP_ID }}
          private-key: ${{ secrets.GIK_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Update only the Components manifest in the existing PR
        run: node scripts/version-components-pr.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
